name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run tests
        run: npm test

      - name: Install browser test tools
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Test phone gameplay and offline mode
        run: |
          python3 -m http.server 4173 --directory .. &
          node tests/browser-smoke.mjs

      - name: Save browser previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-previews
          path: test-results/
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html styles.css manifest.webmanifest sw.js icon.svg _site/
          cp -R src _site/src

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v5
